name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages needs these to publish; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead, and don't cancel a run that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* values are inlined into the JS bundle at build time, not
      # read at runtime, so the key has to be present in THIS step or the
      # gallery ships with an empty string and renders its "not configured"
      # error. This is also why the key is inherently public once deployed:
      # keep it restricted to the Drive API and to this site's referrer.
      - name: Build static export
        env:
          NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_FOLDER_ID }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Fail fast if the key did not make it into the bundle
        run: |
          if grep -rq "NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY to your .env.local" out/_next/static/chunks 2>/dev/null \
             && ! grep -rq "AIza" out/_next/static/chunks 2>/dev/null; then
            echo "::error::Drive API key missing from the build. Add the"
            echo "::error::NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY repository secret."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
